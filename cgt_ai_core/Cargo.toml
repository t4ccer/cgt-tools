[package]
name = "cgt_ai_core"
version = "0.11.0"
edition = "2024"
authors = ["Tomasz Maciosowski <t4ccer@gmail.com>"]
license = "AGPL-3.0"
readme = "../README.md"
repository = "https://github.com/t4ccer/cgt-tools"
description = "Game rules and Monte Carlo tree search for AlphaZero-style players of combinatorial games"
homepage = "https://github.com/t4ccer/cgt-tools"
keywords = ["cgt", "alphazero", "mcts"]
categories = ["mathematics", "science", "games"]
rust-version = "1.88"

[lints]
workspace = true

[dependencies]
cgt = { path = "../." }
rand = { workspace = true, features = ["std"] }
rand_distr = { workspace = true, features = ["std"] }
serde = { workspace = true }
