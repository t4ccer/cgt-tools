[package]
name = "jupyter_rust_widget_backend"
version = "0.10.0"
edition = "2024"
authors = ["Tomasz Maciosowski <t4ccer@gmail.com>"]
license = "AGPL-3.0"
readme = "../README.md"
repository = "https://github.com/t4ccer/cgt-tools"
homepage = "https://github.com/t4ccer/cgt-tools"
keywords = ["cgt"]
categories = ["mathematics", "science"]
publish = false
description = "Kernel-side plumbing for Jupyter widgets implemented in Rust"

[lib]
name = "jupyter_rust_widget_backend"
crate-type = ["rlib"]

[dependencies]
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
