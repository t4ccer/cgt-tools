[workspace]
members = [
  "cgt_cli",
  "cgt_py",
  "cgt_py_messages",
  "cgt_py_widgets",
  "cgt_derive",
  "jupyter_rust_widget_backend",
  "jupyter_rust_widget_frontend",
]
exclude = ["vendor"]

[workspace.dependencies]
# `extension-module` is not enabled here so that the stub generator binary can link against
# libpython. `maturin` turns it on when building the wheel
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
pyo3-stub-gen = { version = "0.23", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
web-sys = { version = "0.3.103", features = [
  "CanvasRenderingContext2d",
  "CssStyleDeclaration",
  "Document",
  "Element",
  "HtmlButtonElement",
  "HtmlCanvasElement",
  "HtmlDivElement",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlLabelElement",
  "HtmlOptionElement",
  "HtmlSelectElement",
  "MouseEvent",
  "Node",
  "ResizeObserver",
  "Window",
] }
wasm-bindgen = "0.2.126"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
new_without_default = "allow"
similar_names = "allow"
must_use_candidate = "allow"
cast_lossless = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
uninlined_format_args = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
needless_update = "allow"
cast_precision_loss = "allow"
missing_panics_doc = "allow"
use_self = "allow"
inline_always = "allow"
too_many_arguments = "allow"
fn_params_excessive_bools = "allow"
single_match_else = "allow"
too_long_first_doc_paragraph = "allow"
should_panic_without_expect = "allow"
multiple_crate_versions = "allow"
type_complexity = "allow"

[package]
name = "cgt"
version = "0.10.0"
edition = "2024"
authors = ["Tomasz Maciosowski <t4ccer@gmail.com>"]
license = "AGPL-3.0"
readme = "README.md"
repository = "https://github.com/t4ccer/cgt-tools"
description = "Combinatorial Game Theory framework"
homepage = "https://github.com/t4ccer/cgt-tools"
keywords = ["cgt"]
categories = ["mathematics", "science"]
documentation = "https://docs.rs/cgt"
rust-version = "1.88"

[lints]
workspace = true

[dependencies]
cgt_derive = { version = "0.10.0", path = "./cgt_derive" }
ahash = { version = "0.8", optional = true }
append-only-vec = "0.1"
auto_ops = "0.3"
num-rational = { version = "0.4", default-features = false, features = ["std"] }
rand = { version = "0.10.2", optional = true }
itertools = "0.15"
dashmap = { version = "6.1", features = ["inline"] }
serde = { version = "1.0", optional = true, features = ["derive"] }
serde_repr = { version = "0.1", optional = true }
rayon = { version = "1.10", optional = true }
tiny-skia = { version = "0.12.0", optional = true }
quickcheck = { version = "1.0", optional = true, default-features = false }
moka = { version = "0.12.11", optional = true, features = ["sync"] }

[dev-dependencies]
quickcheck = { version = "1.0", default-features = false }

[features]
default = []
serde = ["dep:serde", "dep:serde_repr", "num-rational/serde"]
rayon = ["dep:rayon"]
tiny_skia = ["dep:tiny-skia"]
quickcheck = ["dep:quickcheck"]
moka = ["dep:moka"]
rand = ["dep:rand", "dep:ahash"]

[lib]
path = "./cgt/lib.rs"

[profile.release]
# lto = true
debug = true
panic = "abort"
